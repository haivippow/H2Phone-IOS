name: Build rootless and RootHide release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install ldid xz

      - name: Install Theos toolchains
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos-rootless"
          git clone --recursive https://github.com/RootHide/theos.git "$GITHUB_WORKSPACE/theos-roothide"

      - name: Build rootless and RootHide packages
        run: |
          release_dir="$RUNNER_TEMP/h2phone-release"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          rm -f packages/*.deb
          THEOS="$GITHUB_WORKSPACE/theos-rootless" make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb "$release_dir/com.h2phone.ios-rootless.deb"

          rm -f packages/*.deb
          THEOS="$GITHUB_WORKSPACE/theos-roothide" make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mv packages/*.deb "$release_dir/com.h2phone.ios-roothide.deb"

          rm -f packages/*.deb
          cp "$release_dir"/*.deb packages/

      - name: Publish downloadable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" packages/com.h2phone.ios-rootless.deb packages/com.h2phone.ios-roothide.deb --target "${GITHUB_SHA}" --title "H2PHONE ${GITHUB_REF_NAME}" --generate-notes
