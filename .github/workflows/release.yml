name: Build rootless release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install ldid xz

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"

      - name: Build arm64 and arm64e package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          rm -f packages/*.deb
          make clean package FINALPACKAGE=1
          mv packages/*.deb packages/com.h2phone.ios.deb

      - name: Publish downloadable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" packages/com.h2phone.ios.deb --target "${GITHUB_SHA}" --title "H2Changer ${GITHUB_REF_NAME}" --generate-notes
